<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'><title>Checkout – volt</title><link rel='icon' href='favicon.svg'><link rel='stylesheet' href='style.css'></head><body data-page='checkout'>
<div id='hdr'></div><main id='main' class='wrap'>
<div class='ph'><h1>Checkout</h1></div>
<div id='co'><div class='cwrap'><form id='cof'><h2 style='margin-bottom:1rem'>Contact and delivery</h2>
<label>Email<input name='email' type='email' required autocomplete='email'></label>
<div class='two'><label>First name<input name='first' required autocomplete='given-name'></label><label>Last name<input name='last' required autocomplete='family-name'></label></div>
<label>Address<input name='addr' required autocomplete='street-address'></label>
<div class='two'><label>City<input name='city' required autocomplete='address-level2'></label><label>Postcode<input name='zip' required autocomplete='postal-code'></label></div>
<label>Delivery<select name='ship' id='shipsel'><option value='standard'>Standard, 3 to 5 days</option><option value='express'>Express, 1 to 2 days (+$12)</option></select></label>
<p class='note'>Demo store: we don’t take payment or ask for card details, and nothing is shipped.</p>
<button class='btn acc full' type='submit' style='margin-top:1rem'>Place demo order</button></form>
<aside class='sum'><h2>Your order</h2><div id='items'></div></aside></div></div>
</main><div id='ftr'></div><div id='toast' role='status' aria-live='polite'></div><script src='app.js'></script></body></html>
